<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="full-beam-left" x1="268" y1="202" x2="268" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4C4C8" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#71717A" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#3F3F46" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#18181B" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="full-beam-right" x1="332" y1="202" x2="332" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#E4E4E7" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#71717A" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#18181B" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="full-ambient-glow" x1="300" y1="200" x2="300" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="full-diamond-stroke" x1="236" y1="170" x2="364" y2="298" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F4F4F5" />
      <stop offset="100%" stop-color="#D4D4D8" />
    </linearGradient>

    <filter id="full-soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Light Cone -->
  <path d="M236 234 L300 170 L364 234 L364 40 L236 40 Z" fill="url(#full-ambient-glow)" filter="url(#full-soft-glow)" opacity="0.7" />

  <!-- Left Facet Upward Beam -->
  <path d="M236 234 L300 170 L300 50 L236 50 Z" fill="url(#full-beam-left)" />

  <!-- Right Facet Upward Beam -->
  <path d="M300 170 L364 234 L364 50 L300 50 Z" fill="url(#full-beam-right)" />

  <!-- Center Crease Highlight -->
  <line x1="300" y1="170" x2="300" y2="50" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5" />

  <!-- Outer Diamond -->
  <polygon points="300,170 364,234 300,298 236,234" 
           fill="none" 
           stroke="url(#full-diamond-stroke)" 
           stroke-width="13" 
           stroke-linejoin="miter" 
           stroke-miterlimit="10" />

  <!-- Inner Diamond -->
  <polygon points="300,202 332,234 300,266 268,234" 
           fill="none" 
           stroke="#FFFFFF" 
           stroke-width="9" 
           stroke-linejoin="miter" 
           stroke-miterlimit="10" />

  <!-- Typography: INTELECTA -->
  <text x="300" y="380" 
        text-anchor="middle" 
        font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" 
        font-size="44" 
        font-weight="800" 
        letter-spacing="6" 
        fill="#FFFFFF">INTELECTA</text>
</svg>
