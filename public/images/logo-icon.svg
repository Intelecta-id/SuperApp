<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none" width="100%" height="100%">
  <defs>
    <!-- Left beam gradient: subtle darker silver to transparent top -->
    <linearGradient id="beam-left" x1="218" y1="222" x2="218" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4C4C8" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#71717A" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#3F3F46" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#18181B" stop-opacity="0" />
    </linearGradient>

    <!-- Right beam gradient: bright silver-white to transparent top -->
    <linearGradient id="beam-right" x1="282" y1="222" x2="282" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#E4E4E7" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#71717A" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#18181B" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient vertical glow -->
    <linearGradient id="ambient-glow" x1="250" y1="220" x2="250" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Diamond stroke gradient -->
    <linearGradient id="diamond-stroke" x1="186" y1="190" x2="314" y2="318" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F4F4F5" />
      <stop offset="100%" stop-color="#D4D4D8" />
    </linearGradient>

    <!-- Filter for soft blur aura -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Light Cone -->
  <path d="M186 254 L250 190 L314 254 L314 40 L186 40 Z" fill="url(#ambient-glow)" filter="url(#soft-glow)" opacity="0.7" />

  <!-- Left Facet Upward Beam -->
  <path d="M186 254 L250 190 L250 70 L186 70 Z" fill="url(#beam-left)" />

  <!-- Right Facet Upward Beam -->
  <path d="M250 190 L314 254 L314 70 L250 70 Z" fill="url(#beam-right)" />

  <!-- Center Crease Highlight -->
  <line x1="250" y1="190" x2="250" y2="70" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5" />

  <!-- Outer Diamond (Rotated Square) -->
  <polygon points="250,190 314,254 250,318 186,254" 
           fill="none" 
           stroke="url(#diamond-stroke)" 
           stroke-width="13" 
           stroke-linejoin="miter" 
           stroke-miterlimit="10" />

  <!-- Inner Diamond -->
  <polygon points="250,222 282,254 250,286 218,254" 
           fill="none" 
           stroke="#FFFFFF" 
           stroke-width="9" 
           stroke-linejoin="miter" 
           stroke-miterlimit="10" />
</svg>
